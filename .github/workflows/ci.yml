name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development and ML package (execution uses CPU)
        run: python -m pip install -e '.[dev,ml]'
      - name: Offline tests with real synthetic backend
        run: python -m pytest --cov=local_gan --cov-report=term-missing
      - name: Lint
        run: python -m ruff check src tests
      - name: Format
        run: python -m ruff format --check src tests
      - name: Types
        run: python -m mypy src
      - name: Pre-commit
        run: python -m pre_commit run --all-files
      - name: CLI
        run: |
          python -m local_gan --help
          dcgan --help
      - name: Build data-only container
        run: docker build --tag dcgan:ci .
      - name: Container smoke checks
        run: |
          python scripts/synthetic_demo.py
          docker run --rm dcgan:ci --help
          docker run --rm -v "$PWD/synthetic-demo:/data:ro" dcgan:ci check-data --folder /data/images
